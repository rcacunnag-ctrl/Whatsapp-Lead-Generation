services:
  monitor:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DASHBOARD_HOST: 0.0.0.0   # dentro del contenedor; el puerto se publica solo en localhost abajo
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
      - ./auth:/app/auth
